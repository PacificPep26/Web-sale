  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)

  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:

    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {

  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;

  left: 0;

  height: 16px;

  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));

}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {

  padding: 0;
  outline: none;

      color-mix(in srgb, var(--foreground) 7%, transparent)

}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {

  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(

  [aria-selected=&quot;true&quot;],

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {

    min-height: 44px;

  .form-select {

  }

    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {

    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {

  }

  .form-check-input {

    left: 50%;
    width: 44px;
    height: 44px;

  }

  .form-check-label {

  }

  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {

}

}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;model-turntable-v3&#x27;);
  const stage = root.querySelector(&#x27;.turntable-stage&#x27;);
  const portrait = root.querySelector(&#x27;.turntable-portrait&#x27;);
  const label = root.querySelector(&#x27;.turntable-angle&#x27;);

  const views = [
    { angle: 0,   x: 0,   y: 50,  name: &#x27;Chính diện&#x27; },
    { angle: 30,  x: 50,  y: 50,  name: &#x27;Nghiêng phải nhẹ&#x27; },
    { angle: 60,  x: 100, y: 50,  name: &#x27;Ba phần tư phải&#x27; },
    { angle: 90,  x: 0,   y: 100, name: &#x27;Nghiêng phải&#x27; },
    { angle: 135, x: 50,  y: 100, name: &#x27;Sau phải&#x27; },
    { angle: 180, x: 100, y: 100, name: &#x27;Phía sau&#x27; },
    { angle: 225, x: 50,  y: 100, name: &#x27;Sau trái&#x27;, mirror: true },
    { angle: 270, x: 0,   y: 0,   name: &#x27;Nghiêng trái&#x27; },
    { angle: 300, x: 50,  y: 0,   name: &#x27;Ba phần tư trái&#x27; },
    { angle: 330, x: 100, y: 0,   name: &#x27;Nghiêng trái nhẹ&#x27; }
  ];

  let index = 0;
  let startX = 0;
  let startIndex = 0;
  let dragging = false;

  function render() {
    const view = views[index];
    portrait.style.backgroundPosition = `${view.x}% ${view.y}%`;
    portrait.style.transform = view.mirror ? &#x27;scaleX(-1)&#x27; : &#x27;scaleX(1)&#x27;;
    label.textContent = `${view.name} · ${view.angle}°`;
  }

  function setIndex(next) {
    index = (next + views.length) % views.length;
    render();
  }

  stage.addEventListener(&#x27;pointerdown&#x27;, event =&gt; {
    dragging = true;
    startX = event.clientX;
    startIndex = index;
    stage.classList.add(&#x27;is-dragging&#x27;);
    stage.setPointerCapture(event.pointerId);
  });

  stage.addEventListener(&#x27;pointermove&#x27;, event =&gt; {
    if (!dragging) return;
    const steps = Math.round((startX - event.clientX) / 34);
    setIndex(startIndex + steps);
  });

  function stopDrag(event) {
    if (!dragging) return;
    dragging = false;
    stage.classList.remove(&#x27;is-dragging&#x27;);
    if (stage.hasPointerCapture(event.pointerId)) stage.releasePointerCapture(event.pointerId);
  }

  stage.addEventListener(&#x27;pointerup&#x27;, stopDrag);
  stage.addEventListener(&#x27;pointercancel&#x27;, stopDrag);
  stage.addEventListener(&#x27;keydown&#x27;, event =&gt; {
    if (event.key === &#x27;ArrowRight&#x27;) setIndex(index + 1);
    if (event.key === &#x27;ArrowLeft&#x27;) setIndex(index - 1);
  });

  render();
})();
&lt;/script&gt;

    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;

  const skipDelay = 300;

  let pendingTrigger = null;

    target?.nodeType != null &amp;&amp; trigger.contains(target);
